name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Replace GA Measurement ID
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          if [ -z "$GA_MEASUREMENT_ID" ]; then
            echo "GA_MEASUREMENT_ID secret not set; pages keep the placeholder and load no analytics"
            exit 0
          fi
          files=$(grep -rl "__GA_MEASUREMENT_ID__" site --include='*.html' || true)
          for f in $files; do
            echo "Replacing in: $f"
            sed -i "s/__GA_MEASUREMENT_ID__/${GA_MEASUREMENT_ID}/g" "$f"
          done
          if grep -rn "__GA_MEASUREMENT_ID__\|G-XXXXXXXXXX" site --include='*.html'; then
            echo "GA placeholder left in the site" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
