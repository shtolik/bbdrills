name: Build and deploy site with GA injection

on:
  push:
    branches: [ 'main' ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:site

      - name: Inject GA measurement id into built site
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          echo "Injecting GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:+(set)}"
          if [ -n "$GA_MEASUREMENT_ID" ]; then
            # POSIX-safe replace; index.html is expected under site/
            perl -0777 -pe "s/__GA_MEASUREMENT_ID__/$GA_MEASUREMENT_ID/g" -i site/index.html
          else
            echo "GA_MEASUREMENT_ID not set; leaving placeholder unchanged"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
